dependencies:
  idf: ">=5.2"
  # LVGL glue for esp_lcd: owns the LVGL task, tick timer, draw buffers and the LVGL mutex.
  espressif/esp_lvgl_port:
    version: "^2.6.0"
    require: public
  # Pin LVGL to v9 (esp_lvgl_port alone would also accept v8).
  lvgl/lvgl:
    version: "^9.2.0"
    require: public
  # Resistive touch controller of the CYD board. esp_lvgl_port enables its
  # touch support automatically when esp_lcd_touch is part of the build.
  espressif/esp_lcd_touch:
    version: "^1.1.0"
    require: public
  atanisoft/esp_lcd_touch_xpt2046:
    version: "^1.0.5"
